<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Service Request Form</title>
</head>
<body>
    <h1>Company Service Request Form</h1>
    <form method="post" action="#">
<fieldset>
    <legend>1.Personal Information</legend>
    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" name="fullname" required>
    <required min length="2" max length="50"><br><br>
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>
    <br></br>
    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" required>
   <pattern="[0-9]=() -]+">
    <br></br>
</fieldset>
<fieldset>
    <legend>2.Company Information</legend>
    <label for="companyname">Company Name:</label>
    <input type="text" id="companyname" name="companyname" required>
    <requred min length="2" max length="100"><br></br>
    <label for="companyaddress">Company Website:</label>
    <input type="url" id="Website" name="Website" required>
    <br></br>
    <label for="company size">Company Size:</label>
    <select id="company size" name="company size">
        <OPTION value="select company size">select company size</OPTION>
        <option value="small">Small (1-50 employees)</option>
        <option value="medium">Medium (51-200 employees)</option>
        <option value="large">Large (201+ employees)</option>
    </select>
    <br></br>
    <lable for="industry">Industry:</lable>
    <input type="text" id="industy" name="industry">
    <br></br>
</fieldset>
<fieldset>
<legend>3. Service request</legend>
<p>service type:</p>
<input type="radio" id="webdesign" name="service" value="Webdesign" required>
<label for="webdesign">web design</label>
<br>
<input type="radio" id="software development" name="service" value="Software Development">
<label for="software development">Software Development</label>
<br>
<input type="radio" id="Networking" name="service" value="Networking">
<label for="Networking">Networking</label>
 <input type="radio" id="Consulting" name="service" value="Consulting">
 <label for="Consulting">Consulting</label>
 <BR>
    <p>Preffered Contact Method:</p>
    <input type="checkbox" id="email" name="contact method" value="Email">
    <label for="email">Email</label>
    <input type="checkbox" id="phone" name="contact method" value="Phone">
    <label for="phone">Phone</label>
    <input type="checkbox" id="Whatsapp" name="contact method" value="Whatsapp">
    <label for="Whatsapp">Whatsapp</label>
    
    <br></br>
    <label for="Appointment date">Appontment Date:</label>
    <input type="date" id="Appointment date" name="Appointment date">
    <required min="2026-01-01" max="2027-12-31">
        <br></br>
    <label for="Appointment time">Appontment Time:</label>
    <input type="time" id="Appointment time" name="Appointment time">
    <required min="08:00" max="15:00">
        <br></br>
        <lable for="budget">Budget Range:</lable>
        <select id="budget" name="budget">
            <option value="select budget range">Select Budget Range</option>
            <option value="less than ksh 10000">Less than KSH 10000</option>
            <option value="ksh 10000-ksh 50000">KSH 10000-KSH 50000</option>
            <option value="ksh 50000-ksh 100000">KSH 50000-KSH 100000</option>
            <option value="more than ksh 100000">More than KSH 100000</option>
        </select>
</fieldset>
<br></br>
<fieldset>
    <legend>4. Message And Aggreement</legend>
    <label for="Message">Additional Information:</label><br>
    <textarea id="Message" name="Message" rows="5" cols="40"></textarea><min length="10" max length="1000"> </min>
    <br></br>
    <input type="checkbox" id="Terms" name="Terms" value="accepted" required>
    <label for="Terms">I agree to the terms and conditions</label>
</fieldset>
<input type="submit" value="Submit">
<input type="reset" value="reset">
    </form>
</body>
</html>
